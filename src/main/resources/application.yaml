spring:
  application:
    name: techstore-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/techstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-ms: ${JWT_EXPIRACION_MS:3600000}
